# FlipDesk with the built-in SQLite database (simplest).
# All data lives in ./data and ./config on the host — back those up and you have everything.
services:
  flipdesk:
    build: .
    image: flipdesk:latest
    container_name: flipdesk
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: America/New_York
      PUID: 1000              # owner of files written to ./data and ./config
      PGID: 1000
      PUBLIC_URL: https://flip.example.com   # the HTTPS address eBay will redirect to
      # DB_TYPE: sqlite       # default; the database file is /data/flipdesk.db
      # Optional: set eBay keys here instead of in the web UI (they become read-only in the UI)
      # EBAY_CLIENT_ID: YourName-FlipDesk-PRD-xxxxxxxx-xxxxxxxx
      # EBAY_CLIENT_SECRET: PRD-xxxxxxxxxxxx-xxxx-xxxx-xxxx-xxxx
      # EBAY_RUNAME: Your_Name-YourName-FlipDe-xxxxxxxx
      # SESSION_COOKIE_SECURE: "true"   # when only served over HTTPS
      # MFA_REQUIRED: "true"
      # Single sign-on (or configure in Settings → Single sign-on):
      # OIDC_ENABLED: "true"
      # OIDC_DISPLAY_NAME: Authentik
      # OIDC_ISSUER: https://auth.example.com/application/o/flipdesk/
      # OIDC_CLIENT_ID: flipdesk
      # OIDC_CLIENT_SECRET: xxxxxxxx
      # OIDC_ADMIN_GROUPS: flipdesk-admins
    volumes:
      - ./data:/data          # database, photos, receipts, backups
      - ./config:/config      # config.yml (optional) + secret.key (auto-generated, keep it!)
