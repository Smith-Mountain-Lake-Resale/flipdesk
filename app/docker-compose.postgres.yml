# FlipDesk with an external PostgreSQL database.
services:
  flipdesk:
    build: .
    image: flipdesk:latest
    container_name: flipdesk
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      TZ: America/New_York
      PUID: 1000
      PGID: 1000
      PUBLIC_URL: https://flip.example.com
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: flipdesk
      DB_USER: flipdesk
      DB_PASSWORD: change-me-please
      # or a single URL instead of the DB_* variables:
      # DATABASE_URL: postgresql+psycopg://flipdesk:change-me-please@db:5432/flipdesk
    volumes:
      - ./data:/data          # photos, receipts and JSON backups
      - ./config:/config

  db:
    image: postgres:17-alpine
    container_name: flipdesk-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: flipdesk
      POSTGRES_USER: flipdesk
      POSTGRES_PASSWORD: change-me-please
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flipdesk -d flipdesk"]
      interval: 5s
      timeout: 5s
      retries: 20
